@let c = i18n.content().intro;
<section class="intro" id="top">
  <img class="intro__photo" src="assets/dayan-240.webp" [alt]="c.photoAlt" width="120" height="120" />
  <div class="intro__text">
    <h1 class="intro__name">Dayan Cabrera Corvo</h1>
    <p class="intro__kicker">{{ c.kicker }}</p>
    <p class="intro__headline">{{ c.headline }}</p>
    <p class="intro__lede">{{ c.lede }}</p>
    <p class="intro__availability">{{ c.availability }}</p>
    <p class="intro__links">
      <a [href]="cvHref()" target="_blank" rel="noopener">{{ c.cvLabel }}</a>
      <a href="mailto:dayancorvo@gmail.com">dayancorvo&#64;gmail.com</a>
      <a href="https://github.com/DayanCabrera2003" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/dayan-cabrera-corvo" target="_blank" rel="noopener">LinkedIn</a>
    </p>
  </div>
</section>
